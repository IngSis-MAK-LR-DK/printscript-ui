# Construye la imagen Docker de la UI.
#  - En un pull request: solo la construye (detecta un Dockerfile roto antes de mergear).
#  - Al mergear a master: la construye y la publica en GitHub Container Registry.
# La imagen no lleva configuracion de ningun ambiente: se construye UNA vez y se promueve. Auth0 y
# la URL del backend entran al arrancar el contenedor como variables de entorno (ver
# docker-entrypoint.d/40-runtime-config.sh), igual que en el resto de los servicios.
name: Publish image

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ingsis-mak-lr-dk/printscript-ui

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
