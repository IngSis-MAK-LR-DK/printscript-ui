server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de React Router: si no es un archivo, devolver index.html.
    location / {
        try_files $uri /index.html;
    }

    # config.js se genera al arrancar el contenedor: el navegador nunca debe quedarse con uno viejo.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
